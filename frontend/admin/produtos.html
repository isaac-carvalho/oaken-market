<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Produtos — Painel Oaken Market</title>
<script>
  (function () {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="admin-blocked" class="admin-blocked hidden">
  <div class="admin-blocked-box">
    <div class="icon">🔒</div>
    <h1>Acesso restrito</h1>
    <p>Este painel é só para a conta administradora da Oaken Market. A tua conta não tem permissão para entrar aqui.</p>
    <a class="btn btn-primary" href="../index.html">Voltar à loja</a>
  </div>
</div>

<div id="admin-app" class="admin-layout hidden">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a class="logo" href="index.html">OAKEN <span>MARKET</span></a>
      <span class="admin-tag">Painel do produtor</span>
    </div>
    <nav id="admin-nav"></nav>
    <div class="admin-sidebar-footer">
      <div id="admin-user"></div>
      <button type="button" id="admin-logout-btn" class="btn btn-outline btn-sm btn-block">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-title">Produtos</h1>
        <p class="admin-sub">Cursos publicados e em rascunho.</p>
      </div>
    </div>

    <div id="error-box" class="alert alert-error hidden"></div>

    <div class="products-toolbar">
      <button type="button" id="new-course-btn" class="btn btn-primary">+ Criar curso</button>
    </div>

    <div id="loading" class="loading-state">A carregar produtos…</div>
    <div id="products-grid" class="products-grid"></div>
    <div id="empty-state" class="empty-state hidden">Ainda não criaste nenhum curso.</div>
  </main>
</div>

<!-- Modal: criar curso -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>Criar curso</h2>
    <div id="modal-error" class="alert alert-error hidden"></div>
    <form id="course-form">
      <div class="field">
        <label for="c-title">Nome</label>
        <input type="text" id="c-title" required>
      </div>
      <div class="field">
        <label for="c-slug">Slug (URL, ex: meu-curso)</label>
        <input type="text" id="c-slug" pattern="[a-z0-9-]+" title="Só letras minúsculas, números e hífens" required>
      </div>
      <div class="field">
        <label for="c-price">Preço (Kz)</label>
        <input type="number" id="c-price" min="1" step="1" required>
      </div>
      <div class="field">
        <label for="c-desc">Descrição</label>
        <input type="text" id="c-desc">
      </div>
      <div class="field">
        <label for="c-cover">URL da capa (opcional)</label>
        <input type="url" id="c-cover">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="c-category">Categoria</label>
          <select id="c-category">
            <option value="">Selecione a categoria</option>
            <option>Educação</option>
            <option>Negócios & Carreira</option>
            <option>Empreendedorismo Online</option>
            <option>Tecnologia da Informação</option>
            <option>Aplicativos & Software</option>
            <option>Finanças e Investimentos</option>
            <option>Saúde & Esportes</option>
            <option>Culinária & Gastronomia</option>
            <option>Idiomas</option>
            <option>Direito</option>
            <option>Design</option>
            <option>Artes & Música</option>
            <option>Moda & Beleza</option>
            <option>Hobbies</option>
            <option>Outros</option>
          </select>
        </div>
        <div class="field">
          <label for="c-type">Tipo</label>
          <select id="c-type">
            <option value="DIGITAL">Produto Digital</option>
            <option value="PHYSICAL">Produto Físico</option>
            <option value="SERVICE">Serviço</option>
            <option value="PAYMENT">Pagamento</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" id="modal-cancel-btn" class="btn btn-outline btn-block">Cancelar</button>
        <button type="submit" id="modal-submit-btn" class="btn btn-primary btn-block">Criar</button>
      </div>
    </form>
  </div>
</div>

<script src="../app.js"></script>
<script src="admin.js"></script>
<script>
  const user = initAdminPage('produtos');

  if (user) {
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error-box');
    const grid = document.getElementById('products-grid');
    const emptyState = document.getElementById('empty-state');

    const overlay = document.getElementById('modal-overlay');
    const modalError = document.getElementById('modal-error');
    const form = document.getElementById('course-form');
    const submitBtn = document.getElementById('modal-submit-btn');

    function openModal() {
      form.reset();
      clearError(modalError);
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      overlay.classList.add('hidden');
    }

    document.getElementById('new-course-btn').addEventListener('click', openModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    function productCard(course) {
      const card = document.createElement('div');
      card.className = 'product-card';

      const publishedBadge = course.published
        ? '<span class="badge badge-published">Publicado</span>'
        : '<span class="badge badge-draft">Rascunho</span>';

      const enrollments = course._count ? course._count.enrollments : 0;
      const orders = course._count && course._count.orders !== undefined ? course._count.orders : null;

      card.innerHTML = `
        <div class="product-card-top">
          <div>
            <h3>${course.title}</h3>
            <span class="slug">/${course.slug}</span>
          </div>
          ${publishedBadge}
        </div>
        <div class="price">${formatKz(course.priceKz)}</div>
        ${course.category ? `<div class="slug" style="margin-bottom:6px">${course.category}</div>` : ''}
        <div class="product-card-stats">
          <span>${enrollments} matrícula(s)</span>
          ${orders !== null ? `<span>${orders} encomenda(s)</span>` : ''}
        </div>
        <div class="product-card-actions">
          <button type="button" class="btn btn-outline btn-sm btn-block toggle-publish-btn">
            ${course.published ? 'Despublicar' : 'Publicar'}
          </button>
        </div>
      `;

      card.querySelector('.toggle-publish-btn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          await apiFetch(`/api/admin/courses/${course.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ published: !course.published }),
          });
          await loadCourses();
        } catch (err) {
          showError(errorBox, err);
        } finally {
          btn.disabled = false;
        }
      });

      return card;
    }

    async function loadCourses() {
      clearError(errorBox);
      loading.classList.remove('hidden');
      grid.innerHTML = '';
      emptyState.classList.add('hidden');

      try {
        const data = await apiFetch('/api/admin/courses');
        loading.classList.add('hidden');

        const courses = data.courses || [];
        if (courses.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }

        courses.forEach((course) => grid.appendChild(productCard(course)));
      } catch (err) {
        loading.classList.add('hidden');
        showError(errorBox, err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError(modalError);
      submitBtn.disabled = true;

      const body = {
        title: document.getElementById('c-title').value.trim(),
        slug: document.getElementById('c-slug').value.trim(),
        priceKz: Number(document.getElementById('c-price').value),
        description: document.getElementById('c-desc').value.trim(),
        type: document.getElementById('c-type').value,
      };
      const cover = document.getElementById('c-cover').value.trim();
      if (cover) body.coverUrl = cover;
      const category = document.getElementById('c-category').value;
      if (category) body.category = category;

      try {
        await apiFetch('/api/admin/courses', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        closeModal();
        await loadCourses();
      } catch (err) {
        showError(modalError, err);
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadCourses();
  }
</script>
</body>
</html>
