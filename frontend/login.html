<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entrar — Oaken Market</title>
<script>
  // Aplica o tema guardado antes do primeiro paint, para evitar "flash"
  // do tema errado enquanto o resto do JS carrega.
  (function () {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container hflex">
    <a class="logo" href="index.html">OAKEN <span>MARKET</span></a>
    <div class="header-right">
      <a class="btn btn-outline" href="explorar.html">Explorar</a>
      <button type="button" id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" aria-label="Mudar tema">🌙</button>
      <div id="header-actions"></div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="auth-box">
      <h1 id="form-title">Entrar</h1>
      <p class="auth-sub" id="form-sub">Acede aos teus cursos</p>

      <div id="error-box" class="alert alert-error hidden"></div>

      <form id="auth-form">
        <div class="field hidden" id="name-field">
          <label for="name">Nome</label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Entrar</button>
      </form>

      <div class="auth-toggle">
        <span id="toggle-text">Ainda não tens conta?</span>
        <button type="button" id="toggle-btn">Criar conta</button>
      </div>

      <div id="twofa-step" class="hidden">
        <p class="auth-sub">A tua conta tem autenticação de dois factores. Introduz o código de 6 dígitos da tua app autenticadora.</p>
        <form id="twofa-form">
          <div class="field">
            <label for="twofa-code">Código de verificação</label>
            <input type="text" id="twofa-code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary" id="twofa-submit-btn">Confirmar</button>
        </form>
        <div class="auth-toggle">
          <button type="button" id="twofa-back-btn">← Voltar ao login</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
  initTheme();
  renderHeader();

  const nextUrl = new URLSearchParams(window.location.search).get('next') || 'index.html';

  // Se já há sessão activa, não faz sentido mostrar o login.
  if (localStorage.getItem('token')) {
    window.location.href = nextUrl;
  }

  let mode = 'login'; // 'login' | 'signup'

  const form = document.getElementById('auth-form');
  const errorBox = document.getElementById('error-box');
  const nameField = document.getElementById('name-field');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');
  const formTitle = document.getElementById('form-title');
  const formSub = document.getElementById('form-sub');
  const toggleText = document.getElementById('toggle-text');
  const toggleBtn = document.getElementById('toggle-btn');

  function setMode(newMode) {
    mode = newMode;
    clearError(errorBox);
    if (mode === 'login') {
      formTitle.textContent = 'Entrar';
      formSub.textContent = 'Acede aos teus cursos';
      submitBtn.textContent = 'Entrar';
      nameField.classList.add('hidden');
      nameInput.required = false;
      toggleText.textContent = 'Ainda não tens conta?';
      toggleBtn.textContent = 'Criar conta';
    } else {
      formTitle.textContent = 'Criar conta';
      formSub.textContent = 'Regista-te para comprar cursos';
      submitBtn.textContent = 'Criar conta';
      nameField.classList.remove('hidden');
      nameInput.required = true;
      toggleText.textContent = 'Já tens conta?';
      toggleBtn.textContent = 'Entrar';
    }
  }

  toggleBtn.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

  // Segunda etapa (2FA): quando /login devolve requires2FA, guardamos o
  // pendingToken só em memória (nunca em localStorage) até o código ser
  // confirmado — só nesse momento é que ficamos com uma sessão real.
  let pendingToken = null;

  const twofaStep = document.getElementById('twofa-step');
  const twofaForm = document.getElementById('twofa-form');
  const twofaCodeInput = document.getElementById('twofa-code');
  const twofaSubmitBtn = document.getElementById('twofa-submit-btn');
  const twofaBackBtn = document.getElementById('twofa-back-btn');
  const authToggle = document.querySelector('.auth-toggle');

  function showTwoFactorStep() {
    form.classList.add('hidden');
    authToggle.classList.add('hidden');
    twofaStep.classList.remove('hidden');
    twofaCodeInput.focus();
  }

  function backToLoginForm() {
    pendingToken = null;
    twofaForm.reset();
    twofaStep.classList.add('hidden');
    form.classList.remove('hidden');
    authToggle.classList.remove('hidden');
    clearError(errorBox);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError(errorBox);
    submitBtn.disabled = true;

    const body = {
      email: emailInput.value.trim(),
      password: passwordInput.value,
    };
    if (mode === 'signup') {
      body.name = nameInput.value.trim();
    }

    const path = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';

    try {
      const data = await apiFetch(path, {
        method: 'POST',
        body: JSON.stringify(body),
      });

      if (data.requires2FA) {
        pendingToken = data.pendingToken;
        showTwoFactorStep();
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = nextUrl;
    } catch (err) {
      showError(errorBox, err);
    } finally {
      submitBtn.disabled = false;
    }
  });

  twofaForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError(errorBox);
    twofaSubmitBtn.disabled = true;

    try {
      const data = await apiFetch('/api/auth/2fa/login-verify', {
        method: 'POST',
        body: JSON.stringify({ pendingToken, token: twofaCodeInput.value.trim() }),
      });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = nextUrl;
    } catch (err) {
      showError(errorBox, err);
    } finally {
      twofaSubmitBtn.disabled = false;
    }
  });

  twofaBackBtn.addEventListener('click', backToLoginForm);
</script>
</body>
</html>
