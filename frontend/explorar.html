<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Explorar — Oaken Market</title>
<script>
  // Aplica o tema guardado antes do primeiro paint, para evitar "flash"
  // do tema errado enquanto o resto do JS carrega.
  (function () {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container hflex">
    <a class="logo" href="index.html">OAKEN <span>MARKET</span></a>
    <div class="header-right">
      <a class="btn btn-outline" href="explorar.html">Explorar</a>
      <button type="button" id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" aria-label="Mudar tema">🌙</button>
      <div id="header-actions"></div>
    </div>
  </div>
</header>

<main>
  <section class="container catalog-section">
    <h2 class="section-title">Explorar — torna-te afiliado</h2>
    <p class="section-sub">Escolhe um curso para promover e ganha comissão por cada venda.</p>

    <div id="error-box" class="alert alert-error hidden"></div>
    <div id="loading" class="loading-state">A carregar cursos…</div>

    <div id="filter-bar" class="field-row hidden" style="margin-bottom: 20px;">
      <div class="field" style="flex: 2;">
        <label for="search-input">Buscar</label>
        <input type="text" id="search-input" placeholder="Buscar por título…">
      </div>
      <div class="field">
        <label for="category-select">Categoria</label>
        <select id="category-select">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div class="field">
        <label for="sort-select">Ordenar por</label>
        <select id="sort-select">
          <option value="hot">Mais quentes</option>
          <option value="commission">Maior comissão</option>
          <option value="price">Menor preço</option>
        </select>
      </div>
    </div>

    <div id="courses-grid" class="courses-grid"></div>
    <div id="empty-state" class="empty-state hidden">Ainda não há cursos disponíveis para afiliação.</div>
    <div id="no-results-state" class="empty-state hidden">Nenhum curso encontrado com estes filtros.</div>
  </section>
</main>

<script src="app.js"></script>
<script>
  initTheme();
  renderHeader();

  const grid = document.getElementById('courses-grid');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error-box');
  const emptyState = document.getElementById('empty-state');
  const noResultsState = document.getElementById('no-results-state');
  const filterBar = document.getElementById('filter-bar');
  const searchInput = document.getElementById('search-input');
  const categorySelect = document.getElementById('category-select');
  const sortSelect = document.getElementById('sort-select');

  let allCourses = [];

  function courseCard(course) {
    const card = document.createElement('div');
    card.className = 'course-card';

    const cover = course.coverUrl
      ? `<img class="cover" src="${course.coverUrl}" alt="${course.title}">`
      : `<div class="cover-placeholder">${(course.title || '?').charAt(0).toUpperCase()}</div>`;

    card.innerHTML = `
      <div class="course-card-media">${cover}</div>
      <div class="body">
        <h3>${course.title}</h3>
        <div class="course-price">${formatKz(course.priceKz)}</div>
        <p class="affiliate-temp">
          🌡️ ${course.temperatureDegrees}°
          <span class="affiliate-temp-note">${course.recentSalesCount} vendas nos últimos 30 dias</span>
        </p>
        <p class="affiliate-commission">Ganha até ${formatKz(course.maxCommissionKz)} por venda</p>
        <div class="course-card-footer">
          <button type="button" class="btn btn-primary btn-block affiliate-btn">Tornar-me afiliado</button>
          <a class="affiliate-page-link" href="curso.html?slug=${encodeURIComponent(course.slug)}">🔗 Página do afiliado</a>
        </div>
      </div>
    `;

    const btn = card.querySelector('.affiliate-btn');
    btn.addEventListener('click', () => becomeAffiliate(course, btn));

    return card;
  }

  /** Reconstrói a lista de opções do dropdown de categorias a partir dos
   * cursos realmente devolvidos pela API — nunca uma lista fixa. */
  function populateCategoryOptions(courses) {
    const categories = [...new Set(courses.map((c) => c.category).filter(Boolean))].sort();
    categorySelect.innerHTML = '<option value="">Todas as categorias</option>' +
      categories.map((cat) => `<option value="${cat}">${cat}</option>`).join('');
  }

  function sortCourses(courses, sortBy) {
    const sorted = courses.slice();
    if (sortBy === 'commission') {
      sorted.sort((a, b) => (b.maxCommissionKz || 0) - (a.maxCommissionKz || 0));
    } else if (sortBy === 'price') {
      sorted.sort((a, b) => (a.priceKz || 0) - (b.priceKz || 0));
    } else {
      // 'hot' (omissão): temperatureDegrees desc — já é a ordem da API,
      // mas ordenamos de novo aqui para o caso de o filtro/busca mexer.
      sorted.sort((a, b) => (b.temperatureDegrees || 0) - (a.temperatureDegrees || 0));
    }
    return sorted;
  }

  function renderCourses() {
    const query = searchInput.value.trim().toLowerCase();
    const category = categorySelect.value;
    const sortBy = sortSelect.value;

    let filtered = allCourses.filter((c) => {
      const matchesQuery = !query || (c.title || '').toLowerCase().includes(query);
      const matchesCategory = !category || c.category === category;
      return matchesQuery && matchesCategory;
    });

    filtered = sortCourses(filtered, sortBy);

    grid.innerHTML = '';
    if (filtered.length === 0) {
      noResultsState.classList.remove('hidden');
      return;
    }
    noResultsState.classList.add('hidden');
    filtered.forEach((course) => grid.appendChild(courseCard(course)));
  }

  searchInput.addEventListener('input', renderCourses);
  categorySelect.addEventListener('change', renderCourses);
  sortSelect.addEventListener('change', renderCourses);

  async function becomeAffiliate(course, btn) {
    if (!localStorage.getItem('token')) {
      window.location.href = `login.html?next=explorar.html`;
      return;
    }

    btn.disabled = true;
    btn.textContent = 'A enviar…';

    try {
      await apiFetch('/api/affiliates', {
        method: 'POST',
        body: JSON.stringify({ courseId: course.id }),
      });
      btn.textContent = 'Pedido enviado';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Tornar-me afiliado';
      showError(errorBox, err);
    }
  }

  (async () => {
    try {
      const data = await apiFetch('/api/affiliates/explore');
      loading.classList.add('hidden');

      allCourses = data.courses || [];
      if (allCourses.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      populateCategoryOptions(allCourses);
      filterBar.classList.remove('hidden');
      renderCourses();
    } catch (err) {
      loading.classList.add('hidden');
      showError(errorBox, err);
    }
  })();
</script>
</body>
</html>
