<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oaken Market — Cursos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container hflex">
    <a class="logo" href="index.html">OAKEN <span>MARKET</span></a>
    <div id="header-actions"></div>
  </div>
</header>

<main>
  <div class="container">
    <h1 class="page-title">Cursos disponíveis</h1>
    <p class="page-sub">Escolhe um curso para ver detalhes e comprar.</p>

    <div id="error-box" class="alert alert-error hidden"></div>
    <div id="loading" class="loading-state">A carregar cursos…</div>
    <div id="courses-grid" class="courses-grid"></div>
    <div id="empty-state" class="empty-state hidden">Ainda não há cursos publicados.</div>
  </div>
</main>

<script src="app.js"></script>
<script>
  renderHeader();

  const grid = document.getElementById('courses-grid');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error-box');
  const emptyState = document.getElementById('empty-state');

  function courseCard(course) {
    const card = document.createElement('a');
    card.href = `curso.html?slug=${encodeURIComponent(course.slug)}`;
    card.className = 'course-card';

    const cover = course.coverUrl
      ? `<img class="cover" src="${course.coverUrl}" alt="${course.title}">`
      : `<div class="cover-placeholder">${(course.title || '?').charAt(0).toUpperCase()}</div>`;

    card.innerHTML = `
      ${cover}
      <div class="body">
        <h3>${course.title}</h3>
        <p>${course.description || ''}</p>
        <div class="course-price">${formatKz(course.priceKz)}</div>
        <span class="btn btn-primary" style="text-align:center;margin-top:6px">Ver curso</span>
      </div>
    `;
    return card;
  }

  (async () => {
    try {
      const data = await apiFetch('/api/courses');
      loading.classList.add('hidden');

      const courses = data.courses || [];
      if (courses.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      courses.forEach((course) => grid.appendChild(courseCard(course)));
    } catch (err) {
      loading.classList.add('hidden');
      showError(errorBox, err);
    }
  })();
</script>
</body>
</html>
