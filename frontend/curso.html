<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Curso — Oaken Market</title>
<script>
  // Aplica o tema guardado antes do primeiro paint, para evitar "flash"
  // do tema errado enquanto o resto do JS carrega.
  (function () {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container hflex">
    <a class="logo" href="index.html">OAKEN <span>MARKET</span></a>
    <div class="header-right">
      <button type="button" id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" aria-label="Mudar tema">🌙</button>
      <div id="header-actions"></div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div id="error-box" class="alert alert-error hidden"></div>
    <div id="success-box" class="alert alert-success hidden"></div>
    <div id="loading" class="loading-state">A carregar curso…</div>
  </div>

  <div id="course-content" class="hidden">
    <div class="course-banner" id="course-banner">
      <div class="course-banner-overlay"></div>
      <div class="container course-banner-inner">
        <h1 id="course-title"></h1>
      </div>
    </div>

    <div class="container course-layout">
      <div class="course-main">
        <p id="course-description" class="course-desc"></p>
        <div id="modules-list"></div>
      </div>

      <aside class="course-sidebar">
        <div class="buy-box" id="buy-box"></div>
        <div class="included-card">
          <h3>O que está incluído</h3>
          <ul>
            <li>Acesso ao conteúdo do curso</li>
            <li>Certificado por módulo</li>
            <li>Conteúdo actualizado</li>
            <li>Suporte via WhatsApp</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
  initTheme();
  renderHeader();

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  const contentEl = document.getElementById('course-content');
  const titleEl = document.getElementById('course-title');
  const descEl = document.getElementById('course-description');
  const buyBox = document.getElementById('buy-box');
  const modulesList = document.getElementById('modules-list');
  const bannerEl = document.getElementById('course-banner');

  if (!slug) {
    loading.classList.add('hidden');
    showError(errorBox, new Error('Curso não especificado.'));
  }

  function renderModules(course, enrolled) {
    modulesList.innerHTML = '';
    course.modules.forEach((mod) => {
      const modEl = document.createElement('div');
      modEl.className = 'module';

      const header = document.createElement('div');
      header.className = 'module-title';
      header.textContent = `Módulo ${mod.order} — ${mod.title}`;
      modEl.appendChild(header);

      mod.lessons.forEach((lesson) => {
        const lessonEl = document.createElement('div');
        lessonEl.className = 'lesson';

        const hasContent = enrolled && lesson.contentHtml !== undefined;
        const lockIcon = hasContent ? '' : '<span class="lock">&#128274;</span>';
        const duration = lesson.durationMin
          ? `<span class="lesson-duration">${lesson.durationMin} min</span>`
          : '';

        const titleRow = document.createElement('div');
        titleRow.className = 'lesson-title';
        titleRow.innerHTML = `${lockIcon} <span>${lesson.order}. ${lesson.title}</span> ${duration}`;
        lessonEl.appendChild(titleRow);

        if (hasContent) {
          const contentEl2 = document.createElement('div');
          contentEl2.className = 'lesson-content';
          // contentHtml vem da API só quando enrolled:true — nunca é
          // mostrado sem essa confirmação vinda do backend.
          contentEl2.innerHTML = lesson.contentHtml;
          lessonEl.appendChild(contentEl2);
        }

        modEl.appendChild(lessonEl);
      });

      modulesList.appendChild(modEl);
    });
  }

  function renderBuyBox(course, enrolled) {
    buyBox.innerHTML = '';

    if (enrolled) {
      const badge = document.createElement('span');
      badge.className = 'enrolled-badge';
      badge.textContent = 'Já tens acesso';
      buyBox.appendChild(badge);
      renderAffiliateBox(course);
      return;
    }

    const price = document.createElement('div');
    price.className = 'price';
    price.textContent = formatKz(course.priceKz);
    buyBox.appendChild(price);

    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = 'Comprar';
    btn.addEventListener('click', () => buyCourse(course, btn));
    buyBox.appendChild(btn);

    renderAffiliateBox(course);
  }

  /**
   * Mostra o estado de afiliação do utilizador para este curso. Só
   * consulta a API se houver sessão activa — visitante sem login não vê
   * nada de afiliados aqui.
   */
  async function renderAffiliateBox(course) {
    let existing = document.getElementById('affiliate-box');
    if (existing) existing.remove();

    if (!localStorage.getItem('token')) return;

    const box = document.createElement('div');
    box.id = 'affiliate-box';
    box.className = 'affiliate-box';
    buyBox.appendChild(box);

    try {
      const data = await apiFetch('/api/affiliates/me');
      const affiliates = data.affiliates || [];
      const mine = affiliates.find((a) => a.course && a.course.slug === slug);
      renderAffiliateState(box, course, mine);
    } catch (err) {
      // Falha silenciosa aqui — afiliados é um extra, não bloqueia a
      // compra do curso.
      box.remove();
    }
  }

  function renderAffiliateState(box, course, affiliate) {
    box.innerHTML = '';

    if (!affiliate) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-outline btn-block';
      btn.textContent = 'Tornar-me afiliado';
      btn.addEventListener('click', () => requestAffiliation(course, box));
      box.appendChild(btn);
      return;
    }

    if (affiliate.status === 'PENDING') {
      const p = document.createElement('p');
      p.className = 'affiliate-note';
      p.textContent = 'Pedido de afiliação em análise.';
      box.appendChild(p);
      return;
    }

    if (affiliate.status === 'REJECTED') {
      const p = document.createElement('p');
      p.className = 'affiliate-note';
      p.textContent = 'Pedido de afiliação não aprovado.';
      box.appendChild(p);
      return;
    }

    if (affiliate.status === 'APPROVED') {
      const link = `${window.location.origin}${window.location.pathname}?slug=${encodeURIComponent(slug)}&ref=${encodeURIComponent(affiliate.id)}`;

      const label = document.createElement('p');
      label.className = 'affiliate-note';
      label.textContent = 'O teu link de indicação:';
      box.appendChild(label);

      const row = document.createElement('div');
      row.className = 'affiliate-link-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.readOnly = true;
      input.value = link;
      input.className = 'affiliate-link-input';
      row.appendChild(input);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'btn btn-outline btn-sm';
      copyBtn.textContent = 'Copiar';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(link);
          copyBtn.textContent = 'Copiado!';
          setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
        } catch {
          input.select();
        }
      });
      row.appendChild(copyBtn);

      box.appendChild(row);
    }
  }

  async function requestAffiliation(course, box) {
    try {
      await apiFetch('/api/affiliates', {
        method: 'POST',
        body: JSON.stringify({ courseId: course.id }),
      });
      renderAffiliateState(box, course, { status: 'PENDING' });
    } catch (err) {
      showError(errorBox, err);
    }
  }

  async function buyCourse(course, btn) {
    clearError(errorBox);
    successBox.classList.add('hidden');

    if (!localStorage.getItem('token')) {
      window.location.href = `login.html?next=curso.html?slug=${encodeURIComponent(slug)}`;
      return;
    }

    btn.disabled = true;
    btn.textContent = 'A processar…';

    try {
      const refParam = params.get('ref');
      const orderBody = { courseId: course.id, provider: 'manual' };
      if (refParam) {
        orderBody.affiliateRef = refParam;
      }

      const orderData = await apiFetch('/api/orders', {
        method: 'POST',
        body: JSON.stringify(orderBody),
      });

      const providerRef = orderData.order.providerRef;

      // Só existe o provedor "manual" por agora — chamamos o webhook
      // directamente para simular a confirmação de pagamento. Quando o
      // provedor real entrar, este passo deixa de ser necessário aqui.
      await apiFetch('/api/webhooks/manual', {
        method: 'POST',
        body: JSON.stringify({ providerRef }),
      });

      successBox.textContent = 'Compra confirmada! A carregar o conteúdo do curso…';
      successBox.classList.remove('hidden');

      await loadCourse();
    } catch (err) {
      showError(errorBox, err);
      btn.disabled = false;
      btn.textContent = 'Comprar';
    }
  }

  async function loadCourse() {
    try {
      const data = await apiFetch(`/api/courses/${encodeURIComponent(slug)}`);
      loading.classList.add('hidden');
      contentEl.classList.remove('hidden');

      const { course, enrolled } = data;
      titleEl.textContent = course.title;
      descEl.textContent = course.description || '';

      if (course.coverUrl) {
        bannerEl.style.backgroundImage = `url("${course.coverUrl}")`;
        bannerEl.classList.add('has-cover');
      }

      renderBuyBox(course, enrolled);
      renderModules(course, enrolled);
    } catch (err) {
      loading.classList.add('hidden');
      showError(errorBox, err);
    }
  }

  if (slug) {
    loadCourse();
  }
</script>
</body>
</html>
